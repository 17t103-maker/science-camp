<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小六才艺营 - 科学站实时风云榜 (老师控制台)</title>
    <!-- 引入 Firebase SDK (v8 传统脚本版本) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            background-color: #0a1118; color: #fff;
            font-family: 'Microsoft YaHei', sans-serif; padding: 20px; text-align: center;
        }

        /* 🖼️ 老师端响应式 Header 布局 */
        .teacher-top-header-wrapper {
            max-width: 1100px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 20px;
            background: rgba(19, 34, 48, 0.8);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        .header-logo {
            height: 60px; /* 电脑/大屏幕端标准高度 */
            width: auto;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.3));
            flex-shrink: 0;
        }
        .header-title-box {
            flex: 1;
            text-align: center;
        }

        /* 📱 手机屏幕适配 */
        @media (max-width: 600px) {
            .teacher-top-header-wrapper {
                padding: 8px 12px;
                gap: 8px;
            }
            .header-logo {
                height: 42px; /* 移动端按比例缩小 */
                max-width: 95px;
            }
            h1 {
                font-size: 20px !important;
            }
        }

        h1 { color: #00ffcc; font-size: 32px; text-shadow: 0 0 15px rgba(0,255,204,0.4); margin: 0; }
        
        .round-selector-bar {
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .round-btn {
            background: rgba(255,255,255,0.1); border: 1px solid #555; color: #ccc;
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .round-btn.active { background: #00ffcc; color: #0a1118; border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .btn-new-round { background: #ffd700; color: #0a1118; border: none; font-weight: bold; padding: 6px 14px; border-radius: 6px; cursor: pointer; }

        .board-container {
            max-width: 1100px; margin: 0 auto; background: #132230;
            border: 2px solid #00ffcc; border-radius: 12px; padding: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); position: relative;
        }

        .pin-display-card {
            background: rgba(255, 215, 0, 0.1); border: 2px solid #ffd700; border-radius: 10px;
            padding: 12px 20px; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); flex-wrap: wrap; justify-content: center;
        }
        .pin-number {
            font-size: 32px; font-family: monospace; font-weight: bold; color: #ffd700; letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .control-panel-box {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0,255,204,0.3);
            padding: 15px; border-radius: 8px; margin-bottom: 15px;
            display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 12px;
        }

        .registered-box {
            background: rgba(0, 0, 0, 0.2); border: 1px solid #334e68; border-radius: 6px; padding: 10px; margin-bottom: 15px; text-align: left;
        }
        .reg-tag {
            display: inline-block; background: rgba(0,255,204,0.1); border: 1px solid #00ffcc;
            color: #00ffcc; font-size: 12px; padding: 3px 8px; border-radius: 4px; margin: 3px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #ffd700; font-size: 14px; border-bottom: 2px solid #ffd700; }
        tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
        tr:nth-child(2) td { color: #c0c0c0; font-weight: bold; }
        tr:nth-child(3) td { color: #cd7f32; font-weight: bold; }
        .badge {
            background: rgba(0,255,204,0.1); border: 1px solid #00ffcc;
            padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #00ffcc;
        }
        
        .btn-ctrl {
            padding: 8px 16px; font-size: 13px; font-weight: bold; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; border: none;
        }
        .btn-stage1 { background: #00ffcc; color: #0a1118; }
        .btn-stage2 { background: #ffd700; color: #0a1118; }
        .btn-end { background: #ff4a4a; color: #fff; }
        .btn-ceremony {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #0a1118; box-shadow: 0 0 15px rgba(255,215,0,0.5); font-size: 14px;
        }
        .btn-ceremony:hover { box-shadow: 0 0 25px rgba(255,215,0,0.8); transform: scale(1.03); }
        .btn-export { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #aaa; }
        .btn-ctrl:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        
        .penalty-tag-yes { background: rgba(255, 74, 74, 0.2); border: 1px solid #ff4a4a; color: #ff4a4a; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .penalty-tag-no { color: #00ffcc; font-size: 11px; }

        .detail-tag {
            display: inline-block; padding: 2px 5px; border-radius: 3px; font-size: 11px; font-family: monospace; margin: 1px;
        }
        .tag-correct-2 { background: rgba(0, 255, 204, 0.2); border: 1px solid #00ffcc; color: #00ffcc; }
        .tag-correct-1 { background: rgba(255, 215, 0, 0.2); border: 1px solid #ffd700; color: #ffd700; }
        .tag-wrong-0 { background: rgba(255, 74, 74, 0.2); border: 1px solid #ff4a4a; color: #ff4a4a; }
        .tag-unsolved { background: rgba(255, 255, 255, 0.1); border: 1px solid #777; color: #aaa; }

        .btn-inspect {
            background: rgba(0, 255, 204, 0.2); border: 1px solid #00ffcc; color: #00ffcc;
            padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;
        }
        .btn-inspect:hover { background: #00ffcc; color: #0a1118; }

        .overlay {
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 17, 24, 0.95); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #132230; border: 2px solid #00ffcc; border-radius: 12px;
            padding: 25px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; text-align: left;
        }

        .podium-modal {
            background: #132230; border: 3px solid #ffd700; border-radius: 16px;
            padding: 30px 20px; max-width: 750px; width: 92%; box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
            position: relative; overflow: hidden; text-align: center;
        }
        .podium-stage {
            display: flex; justify-content: center; align-items: flex-end;
            margin-top: 40px; margin-bottom: 20px; gap: 15px; height: 260px;
        }
        .podium-step {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            border-radius: 8px 8px 0 0; position: relative; transition: all 0.5s ease;
        }
        .step-1 {
            height: 180px; background: linear-gradient(180deg, #ffd700, #b38f00);
            border: 2px solid #fff; box-shadow: 0 0 20px rgba(255,215,0,0.6); order: 2;
        }
        .step-2 {
            height: 130px; background: linear-gradient(180deg, #c0c0c0, #7f8c8d);
            border: 2px solid #fff; order: 1;
        }
        .step-3 {
            height: 90px; background: linear-gradient(180deg, #cd7f32, #8b4513);
            border: 2px solid #fff; order: 3;
        }
        
        .podium-card {
            position: absolute; top: -110px; width: 95%; text-align: center;
            background: rgba(10, 17, 24, 0.85); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 4px; border-radius: 8px; backdrop-filter: blur(5px);
        }
        .podium-crown { font-size: 28px; line-height: 1; margin-bottom: 2px; }
        .podium-team-name { font-size: 16px; font-weight: bold; color: #fff; text-shadow: 0 0 8px rgba(0,0,0,0.8); }
        .podium-group-tag { font-size: 11px; color: #00ffcc; margin-top: 2px; }
        .podium-score { font-size: 13px; color: #ffd700; font-weight: bold; margin-top: 2px; }
        .podium-rank-num { font-size: 42px; font-weight: 900; color: rgba(255,255,255,0.3); }

        .answer-setting-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
            background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; border: 1px solid #334e68;
        }
        .answer-select {
            background: #0a1118; color: #00ffcc; border: 1px solid #00ffcc;
            padding: 6px 10px; border-radius: 4px; outline: none; font-size: 14px;
        }

        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 2001;
        }

        @media print {
            body { background-color: #ffffff !important; color: #000000 !important; padding: 10px; }
            h1 { color: #000000 !important; text-shadow: none !important; font-size: 24px; }
            .board-container { border: 1px solid #ccc !important; box-shadow: none !important; background: #ffffff !important; }
            th { color: #000000 !important; border-bottom: 2px solid #000 !important; }
            td { color: #000000 !important; border-bottom: 1px solid #ddd !important; }
            .badge { border: 1px solid #666 !important; color: #000 !important; background: none !important; }
            .round-selector-bar, .control-panel-box, .registered-box, .overlay, .pin-display-card, .btn-inspect, .teacher-top-header-wrapper { display: none !important; }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <!-- 🖼️ 顶部三栏结构（左校徽 - 中标题 - 右口号） -->
    <div class="teacher-top-header-wrapper">
        <img src="image/image1.jpg" alt="居銮中华中学校徽" class="header-logo">
        <div class="header-title-box">
            <h1>🏆 小六才艺营 - 科学站实时风云榜</h1>
        </div>
        <img src="image/image2.jpg" alt="銮中口号" class="header-logo">
    </div>
    
    <div class="round-selector-bar">
        <span><b>比赛轮次：</b></span>
        <div id="round-buttons-list" style="display:inline-flex; gap:6px; flex-wrap:wrap;"></div>
        <button class="btn-new-round" onclick="addNewRound()">➕ 开启新一轮比赛</button>
    </div>

    <div class="pin-display-card">
        <span style="font-size:15px; color:#fff; font-weight:bold;">🔑 第 <span id="pin-round-num">1</span> 轮 现场 PIN 码：</span>
        <span class="pin-number" id="current-pin-display">----</span>
        <button onclick="generateNewPin()" style="background:rgba(255,255,255,0.1); border:1px solid #ffd700; color:#ffd700; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:11px;">🔄 刷新PIN</button>
        <button onclick="openAnswersModal()" style="background:rgba(0,255,204,0.1); border:1px solid #00ffcc; color:#00ffcc; border-radius:4px; padding:4px 10px; cursor:pointer; font-size:12px; font-weight:bold; margin-left:10px;">⚙️ 设置本轮标准答案</button>
    </div>

    <div class="board-container">
        <div class="control-panel-box">
            <div>状态：<b id="status-text" style="color:#ffd700;">等待开始</b></div>
            <button class="btn-ctrl btn-stage1" id="btn-start-s1" onclick="startStage1()">🚀 启动阶段一 (开始比赛)</button>
            <button class="btn-ctrl btn-stage2" id="btn-start-s2" onclick="startStage2()" disabled>🧪 启动阶段二统一答题</button>
            <button class="btn-ctrl btn-end" id="btn-end-round" onclick="endCurrentRound()">🏁 结束本轮比赛</button>
            <button class="btn-ctrl btn-ceremony" id="btn-ceremony" onclick="openCeremonyModal()">🏆 颁奖盛典 (成绩检视)</button>
        </div>

        <div class="registered-box">
            <span style="font-size:12px; color:#a0b0c0;">📌 本轮已登记小队 (<span id="reg-count">0</span>)：</span>
            <div id="registered-teams-list" style="margin-top:5px;"></div>
        </div>

        <h3 id="table-title" style="color:#00ffcc; font-size:16px; text-align:left; margin:15px 0 5px 0;">📊 实时榜单：</h3>
        <table>
            <thead id="leaderboard-head"></thead>
            <tbody id="leaderboard-body"></tbody>
        </table>

        <div style="margin-top:20px; display:flex; justify-content:center; gap:10px;">
            <button class="btn-ctrl btn-export" onclick="exportPDF()">📄 导出本轮成绩单 (PDF)</button>
            <button class="btn-ctrl btn-end" style="background:rgba(255,74,74,0.2); border:1px solid #ff4a4a;" onclick="clearCurrentRoundData()">🗑️ 清空本轮成绩数据</button>
        </div>
    </div>

    <!-- 1. 设置参考答案弹窗 -->
    <div class="overlay" id="answers-modal" style="display:none;">
        <div class="modal-box">
            <h2 style="color:#00ffcc; margin-top:0; font-size:20px;">⚙️ 设置第 <span id="ans-modal-round">1</span> 轮未知溶液标准答案</h2>
            <p style="font-size:12px; color:#a0b0c0; margin-bottom:15px;">更改后，系统将自动加密保存至云端，学生端验证答案将比对加密密文！</p>
            
            <div id="answers-form-container"></div>

            <div style="display:flex; justify-content:space-between; gap:10px; margin-top:20px;">
                <button class="btn-ctrl btn-stage2" onclick="randomizeAnswers()">🎲 一键随机生成答案</button>
                <div>
                    <button class="btn-ctrl btn-export" onclick="closeAnswersModal()">取消</button>
                    <button class="btn-ctrl btn-stage1" onclick="saveAnswersAndRecalculate()">💾 保存并更新答案</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 检视/重算学生作答明细弹窗 -->
    <div class="overlay" id="inspect-modal" style="display:none;">
        <div class="modal-box">
            <h2 style="color:#ffd700; margin-top:0; font-size:20px;">👁️ 组别答题明细与重算：<span id="inspect-group-name" style="color:#00ffcc;"></span></h2>
            <p style="font-size:12px; color:#a0b0c0; margin-bottom:15px;">小队名称：<b id="inspect-team-name" style="color:#fff;"></b></p>
            
            <table style="margin-bottom:15px;">
                <thead>
                    <tr>
                        <th>溶液</th>
                        <th>学生选择</th>
                        <th>标准答案</th>
                        <th>尝试次数</th>
                        <th>目前得分</th>
                    </tr>
                </thead>
                <tbody id="inspect-details-body"></tbody>
            </table>

            <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:6px; font-size:12px; line-height:1.6; margin-bottom:15px;">
                <b>当前记录总分：</b><span id="inspect-total-score" style="color:#ffd700; font-weight:bold;"></span> 分 | 
                <b>用时：</b><span id="inspect-total-time" style="color:#00ffcc; font-weight:bold; font-family:monospace;"></span>
            </div>

            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button class="btn-ctrl btn-stage2" onclick="recalculateSingleGroup()">🔄 按当前标准答案重新批阅该组</button>
                <button class="btn-ctrl btn-export" onclick="closeInspectModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 3. 颁奖盛典弹窗 -->
    <div class="overlay" id="ceremony-modal" style="display:none;">
        <div class="podium-modal">
            <h2 style="color:#ffd700; font-size:28px; margin:0; text-shadow:0 0 15px rgba(255,215,0,0.6);">🎉 第 <span id="podium-round-num">1</span> 轮 · 荣耀颁奖台 🎉</h2>
            <p style="color:#a0b0c0; font-size:13px; margin-top:5px;">热烈祝贺本轮表现最出色的特工小队！</p>

            <div class="podium-stage">
                <!-- 亚军 -->
                <div class="podium-step step-2">
                    <div class="podium-card" id="card-rank-2">
                        <div class="podium-crown">🥈</div>
                        <div class="podium-team-name" id="name-rank-2">虚位以待</div>
                        <div class="podium-group-tag" id="group-rank-2">-</div>
                        <div class="podium-score" id="score-rank-2">-</div>
                    </div>
                    <div class="podium-rank-num">2</div>
                </div>

                <!-- 冠军 -->
                <div class="podium-step step-1">
                    <div class="podium-card" id="card-rank-1" style="border-color:#ffd700; box-shadow:0 0 15px rgba(255,215,0,0.3);">
                        <div class="podium-crown">🥇</div>
                        <div class="podium-team-name" id="name-rank-1" style="color:#ffd700; font-size:18px;">虚位以待</div>
                        <div class="podium-group-tag" id="group-rank-1">-</div>
                        <div class="podium-score" id="score-rank-1">-</div>
                    </div>
                    <div class="podium-rank-num" style="color:rgba(255,215,0,0.4);">1</div>
                </div>

                <!-- 季军 -->
                <div class="podium-step step-3">
                    <div class="podium-card" id="card-rank-3">
                        <div class="podium-crown">🥉</div>
                        <div class="podium-team-name" id="name-rank-3">虚位以待</div>
                        <div class="podium-group-tag" id="group-rank-3">-</div>
                        <div class="podium-score" id="score-rank-3">-</div>
                    </div>
                    <div class="podium-rank-num">3</div>
                </div>
            </div>

            <div style="display:flex; justify-content:center; gap:15px; margin-top:15px;">
                <button class="btn-ctrl btn-ceremony" onclick="triggerCelebrationEffects()">🎆 再次触发撒花音效</button>
                <button class="btn-ctrl btn-export" onclick="closeCeremonyModal()">关闭检视</button>
            </div>
        </div>
    </div>

<script>
    // 🔑 初始化 Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDxN0g2848g3oUeB33IBkaHNOFxpMJqICo",
        authDomain: "science-camp-52b23.firebaseapp.com",
        databaseURL: "https://science-camp-52b23-default-rtdb.firebaseio.com",
        projectId: "science-camp-52b23",
        storageBucket: "science-camp-52b23.firebasestorage.app",
        messagingSenderId: "1083831118018",
        appId: "1:1083831118018:web:8a5c5f5b55af703da6f35b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var currentRoundId = '1';

    // 🛡️ 方案 A 掩码加密工具函数
    var OPTION_MAP = { '强酸性': 1, '弱酸性': 2, '中性': 3, '弱碱性': 4, '强碱性': 5 };
    var CODE_TO_OPTION = { 1: '强酸性', 2: '弱酸性', 3: '中性', 4: '弱碱性', 5: '强碱性' };

    function encryptAns(str) {
        var code = OPTION_MAP[str] || 3;
        return code * 7 + 13;
    }

    function decryptAns(val) {
        if (typeof val === 'string') return val;
        var code = (val - 13) / 7;
        return CODE_TO_OPTION[code] || '中性';
    }

    // 默认参考答案（以加密数值存储）
    var defaultAnswers = { 
        'A': encryptAns('强酸性'), 
        'B': encryptAns('弱酸性'), 
        'C': encryptAns('中性'), 
        'D': encryptAns('弱碱性'), 
        'E': encryptAns('强碱性') 
    };
    var currentAnswers = { ...defaultAnswers };
    var currentInspectingGroup = null;

    function initRounds() {
        db.ref('rounds_list').on('value', (snap) => {
            var rounds = snap.val() || ["1"];
            db.ref('current_round_id').once('value', (curSnap) => {
                currentRoundId = curSnap.val() || rounds[rounds.length - 1];
                ensurePinExists(currentRoundId);
                ensureAnswersExist(currentRoundId);
                renderRoundButtons(rounds);
                listenCurrentRoundData();
            });
        });
    }

    function ensurePinExists(rId) {
        db.ref(`rounds/${rId}/pin`).once('value', (snap) => {
            var pin = snap.val();
            if (!pin) {
                pin = String(Math.floor(1000 + Math.random() * 9000));
                db.ref(`rounds/${rId}/pin`).set(pin);
            }
            document.getElementById('pin-round-num').innerText = rId;
            document.getElementById('current-pin-display').innerText = pin;
        });
    }

    function ensureAnswersExist(rId) {
        db.ref(`rounds/${rId}/answers`).on('value', (snap) => {
            var ans = snap.val();
            if (!ans) {
                db.ref(`rounds/${rId}/answers`).set(defaultAnswers);
                currentAnswers = { ...defaultAnswers };
            } else {
                currentAnswers = ans;
            }
        });
    }

    function generateNewPin() {
        var pin = String(Math.floor(1000 + Math.random() * 9000));
        db.ref(`rounds/${currentRoundId}/pin`).set(pin);
        alert(`🔑 已为第 ${currentRoundId} 轮生成新 PIN 码：${pin}`);
    }

    function renderRoundButtons(rounds) {
        var container = document.getElementById('round-buttons-list');
        container.innerHTML = '';
        rounds.forEach(r => {
            var activeClass = (r === currentRoundId) ? 'active' : '';
            container.innerHTML += `<button class="round-btn ${activeClass}" onclick="switchRound('${r}')">第 ${r} 轮</button>`;
        });
    }

    function switchRound(rId) {
        currentRoundId = rId;
        db.ref('current_round_id').set(rId);
        ensurePinExists(rId);
        ensureAnswersExist(rId);
        listenCurrentRoundData();
    }

    function addNewRound() {
        db.ref('rounds_list').once('value', (snap) => {
            var rounds = snap.val() || ["1"];
            var newId = String(parseInt(rounds[rounds.length - 1] || '0') + 1);
            rounds.push(newId);
            db.ref('rounds_list').set(rounds);
            switchRound(newId);
        });
    }

    function startStage1() {
        if (confirm("📢 是否确认立即统一开启【阶段一】？")) {
            var state = { status: 'stage1', stage1_started: true, stage1_time: new Date().toISOString() };
            db.ref(`rounds/${currentRoundId}/room_state`).set(state);
        }
    }

    function startStage2() {
        if (confirm("📢 是否确认立即统一开启【阶段二线下实战】？")) {
            db.ref(`rounds/${currentRoundId}/room_state`).update({
                status: 'stage2', stage2_started: true, stage2_time: new Date().toISOString()
            });
        }
    }

    function endCurrentRound() {
        if (confirm("⚠️ 确定要结束本轮比赛吗？结束后未完成的队伍将被强制按当前进度结算成绩！")) {
            db.ref(`rounds/${currentRoundId}/room_state/status`).set('ended');
        }
    }

    function listenCurrentRoundData() {
        db.ref(`rounds/${currentRoundId}/pin`).on('value', snap => {
            document.getElementById('current-pin-display').innerText = snap.val() || '----';
        });

        db.ref(`rounds/${currentRoundId}/room_state`).on('value', snap => {
            var state = snap.val() || { status: 'waiting' };
            var statusTxt = document.getElementById('status-text');
            var btnS1 = document.getElementById('btn-start-s1');
            var btnS2 = document.getElementById('btn-start-s2');
            var btnEnd = document.getElementById('btn-end-round');

            if (state.status === 'waiting') {
                statusTxt.innerText = `第 ${currentRoundId} 轮：等待小队登记...`;
                statusTxt.style.color = "#ffd700";
                btnS1.disabled = false; btnS2.disabled = true; btnEnd.disabled = false;
            } else if (state.status === 'stage1') {
                statusTxt.innerText = `第 ${currentRoundId} 轮：阶段一进行中...`;
                statusTxt.style.color = "#00ffcc";
                btnS1.disabled = true; btnS2.disabled = false; btnEnd.disabled = false;
            } else if (state.status === 'stage2') {
                statusTxt.innerText = `第 ${currentRoundId} 轮：阶段二实战化验中...`;
                statusTxt.style.color = "#00ffcc";
                btnS1.disabled = true; btnS2.disabled = true; btnEnd.disabled = false;
            } else if (state.status === 'ended') {
                statusTxt.innerText = `第 ${currentRoundId} 轮：比赛已宣布结束 (已锁定)`;
                statusTxt.style.color = "#ff4a4a";
                btnS1.disabled = true; btnS2.disabled = true; btnEnd.disabled = true;
            }

            updateLeaderboard(state.status);
        });

        db.ref(`rounds/${currentRoundId}/registered_teams`).on('value', snap => {
            var data = snap.val() || {};
            var regs = Object.values(data);
            document.getElementById('reg-count').innerText = regs.length;
            var container = document.getElementById('registered-teams-list');
            if (regs.length === 0) {
                container.innerHTML = '<span style="font-size:12px; color:#666;">暂无小队登记</span>';
                return;
            }
            container.innerHTML = '';
            regs.forEach(r => {
                container.innerHTML += `<span class="reg-tag"><b>${r.group}</b>: ${r.team}</span>`;
            });
        });
    }

    function updateLeaderboard(status) {
        var head = document.getElementById('leaderboard-head');
        var tbody = document.getElementById('leaderboard-body');
        var title = document.getElementById('table-title');

        if (status === 'stage1') {
            title.innerText = "⏱️ 第一阶段捕获即时榜 (完成即可上榜)：";
            head.innerHTML = `
                <tr>
                    <th>名次</th>
                    <th>组别</th>
                    <th>小队名称</th>
                    <th>阶段一纯用时</th>
                    <th>罚时判定 (>60s)</th>
                </tr>
            `;

            db.ref(`rounds/${currentRoundId}/stage1_results`).on('value', snap => {
                var s1Data = Object.values(snap.val() || {});
                s1Data.sort((a,b) => a.s1_seconds - b.s1_seconds);

                tbody.innerHTML = '';
                if (s1Data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="color:#88a0b5;">等待小队完成第一阶段...</td></tr>';
                    return;
                }

                s1Data.forEach((item, index) => {
                    var rankIcon = index === 0 ? '🥇 1' : index === 1 ? '🥈 2' : index === 2 ? '🥉 3' : (index + 1);
                    var penText = item.hasPenalty ? '<span class="penalty-tag-yes">⚠️ 超时 (+30s 罚时)</span>' : '<span class="penalty-tag-no">✅ 合格</span>';
                    tbody.innerHTML += `
                        <tr>
                            <td>${rankIcon}</td>
                            <td><span class="badge">${item.group}</span></td>
                            <td>${item.team}</td>
                            <td style="font-family:monospace; font-weight:bold; color:#00ffcc;">${item.time_s1}</td>
                            <td>${penText}</td>
                        </tr>
                    `;
                });
            });

        } else {
            title.innerText = "🏆 本轮最终风云总榜：";
            head.innerHTML = `
                <tr>
                    <th>名次</th>
                    <th>组别</th>
                    <th>小队名称</th>
                    <th>得分 (满分10)</th>
                    <th>答题明细 (A-E)</th>
                    <th>总用时</th>
                    <th>罚时状态</th>
                    <th>检视与重算</th>
                </tr>
            `;

            db.ref(`rounds/${currentRoundId}/leaderboard`).on('value', snap => {
                var data = Object.values(snap.val() || {});
                data.sort((a, b) => (b.score !== a.score) ? (b.score - a.score) : (a.total_seconds - b.total_seconds));

                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="color:#88a0b5;">等待小队提交最终成绩...</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    var rankIcon = index === 0 ? '🥇 1' : index === 1 ? '🥈 2' : index === 2 ? '🥉 3' : (index + 1);
                    var penStatus = item.hasPenalty ? '<span class="penalty-tag-yes">⚠️ 含30s罚时</span>' : '<span class="penalty-tag-no">✅ 正常</span>';
                    
                    var detailsHtml = '';
                    ['A', 'B', 'C', 'D', 'E'].forEach(k => {
                        var d = (item.details && item.details[k]) ? item.details[k] : { score: 0, attempts: 0 };
                        var tagClass = d.attempts === 0 ? 'tag-unsolved' : (d.score === 2 ? 'tag-correct-2' : (d.score === 1 ? 'tag-correct-1' : 'tag-wrong-0'));
                        var symbol = d.attempts === 0 ? '-' : (d.score > 0 ? '✓' : '✗');
                        detailsHtml += `<span class="detail-tag ${tagClass}">${k}:${symbol}${d.score}分</span>`;
                    });

                    tbody.innerHTML += `
                        <tr>
                            <td>${rankIcon}</td>
                            <td><span class="badge">${item.group}</span></td>
                            <td>${item.team}</td>
                            <td style="color:#ffd700; font-weight:bold; font-size:16px;">${item.score} 分</td>
                            <td>${detailsHtml}</td>
                            <td style="font-family:monospace; color:#00ffcc; font-weight:bold;">${item.time_used}</td>
                            <td>${penStatus}</td>
                            <td><button class="btn-inspect" onclick="openInspectModal('${item.group}')">👁️ 检视/重算</button></td>
                        </tr>
                    `;
                });
            });
        }
    }

    // --- 参考答案设置模态框 ---
    function openAnswersModal() {
        document.getElementById('ans-modal-round').innerText = currentRoundId;
        var container = document.getElementById('answers-form-container');
        container.innerHTML = '';

        var options = ['强酸性', '弱酸性', '中性', '弱碱性', '强碱性'];
        ['A', 'B', 'C', 'D', 'E'].forEach(k => {
            var rawVal = currentAnswers[k] || defaultAnswers[k];
            var currentText = decryptAns(rawVal);
            var optsHtml = options.map(opt => `<option value="${opt}" ${opt === currentText ? 'selected' : ''}>${opt}</option>`).join('');
            
            container.innerHTML += `
                <div class="answer-setting-row">
                    <span style="font-weight:bold; color:#ffd700;">未知溶液 ${k} 参考答案：</span>
                    <select class="answer-select" id="ans-select-${k}">${optsHtml}</select>
                </div>
            `;
        });

        document.getElementById('answers-modal').style.display = 'flex';
    }

    function closeAnswersModal() {
        document.getElementById('answers-modal').style.display = 'none';
    }

    function randomizeAnswers() {
        var options = ['强酸性', '弱酸性', '中性', '弱碱性', '强碱性'];
        var shuffled = [...options].sort(() => Math.random() - 0.5);
        ['A', 'B', 'C', 'D', 'E'].forEach((k, idx) => {
            document.getElementById(`ans-select-${k}`).value = shuffled[idx];
        });
    }

    function saveAnswersAndRecalculate() {
        var newAns = {};
        ['A', 'B', 'C', 'D', 'E'].forEach(k => {
            var selectedText = document.getElementById(`ans-select-${k}`).value;
            newAns[k] = encryptAns(selectedText);
        });

        currentAnswers = newAns;
        db.ref(`rounds/${currentRoundId}/answers`).set(newAns);

        if (confirm("✅ 答案设置成功！是否立即按新答案重新批阅本轮所有已提交的小队？")) {
            recalculateAllLeaderboard();
        }
        closeAnswersModal();
    }

    // --- 检视与重算逻辑 ---
    function openInspectModal(groupKey) {
        currentInspectingGroup = groupKey;
        db.ref(`rounds/${currentRoundId}/leaderboard/${groupKey}`).once('value', snap => {
            var item = snap.val();
            if (!item) return;

            document.getElementById('inspect-group-name').innerText = item.group;
            document.getElementById('inspect-team-name').innerText = item.team;
            document.getElementById('inspect-total-score').innerText = item.score;
            document.getElementById('inspect-total-time').innerText = item.time_used;

            var tbody = document.getElementById('inspect-details-body');
            tbody.innerHTML = '';

            ['A', 'B', 'C', 'D', 'E'].forEach(k => {
                var d = (item.details && item.details[k]) ? item.details[k] : { choice: '未答', attempts: 0, score: 0 };
                var targetEncrypted = currentAnswers[k] || defaultAnswers[k];
                var correctAnsText = decryptAns(targetEncrypted);
                var userEncrypted = encryptAns(d.choice);
                var isCorrect = (userEncrypted === targetEncrypted) || (d.choice === correctAnsText);

                tbody.innerHTML += `
                    <tr>
                        <td><b>溶液 ${k}</b></td>
                        <td style="color:${isCorrect ? '#00ffcc' : '#ff4a4a'};">${d.choice}</td>
                        <td style="color:#ffd700;">${correctAnsText}</td>
                        <td>${d.attempts} 次</td>
                        <td><b>${d.score}</b> 分</td>
                    </tr>
                `;
            });

            document.getElementById('inspect-modal').style.display = 'flex';
        });
    }

    function closeInspectModal() {
        document.getElementById('inspect-modal').style.display = 'none';
    }

    function recalculateSingleGroup() {
        if (!currentInspectingGroup) return;
        db.ref(`rounds/${currentRoundId}/leaderboard/${currentInspectingGroup}`).once('value', snap => {
            var item = snap.val();
            if (!item) return;

            var recalculatedScore = 0;
            ['A', 'B', 'C', 'D', 'E'].forEach(k => {
                if (item.details && item.details[k]) {
                    var d = item.details[k];
                    var targetEncrypted = currentAnswers[k] || defaultAnswers[k];
                    var userEncrypted = encryptAns(d.choice);

                    if (userEncrypted === targetEncrypted || d.choice === decryptAns(targetEncrypted)) {
                        d.score = (d.attempts === 1) ? 2 : (d.attempts === 2 ? 1 : 0);
                    } else {
                        d.score = 0;
                    }
                    recalculatedScore += d.score;
                }
            });

            item.score = recalculatedScore;
            db.ref(`rounds/${currentRoundId}/leaderboard/${currentInspectingGroup}`).set(item);
            alert(`✅ 重算完成！组别 ${currentInspectingGroup} 最新得分为：${recalculatedScore} 分`);
            openInspectModal(currentInspectingGroup);
        });
    }

    function recalculateAllLeaderboard() {
        db.ref(`rounds/${currentRoundId}/leaderboard`).once('value', snap => {
            var dataObj = snap.val() || {};
            Object.keys(dataObj).forEach(gKey => {
                var item = dataObj[gKey];
                var newTotal = 0;
                ['A', 'B', 'C', 'D', 'E'].forEach(k => {
                    if (item.details && item.details[k]) {
                        var d = item.details[k];
                        var targetEncrypted = currentAnswers[k] || defaultAnswers[k];
                        var userEncrypted = encryptAns(d.choice);

                        if (userEncrypted === targetEncrypted || d.choice === decryptAns(targetEncrypted)) {
                            d.score = (d.attempts === 1) ? 2 : (d.attempts === 2 ? 1 : 0);
                        } else {
                            d.score = 0;
                        }
                        newTotal += d.score;
                    }
                });
                item.score = newTotal;
                db.ref(`rounds/${currentRoundId}/leaderboard/${gKey}`).set(item);
            });
            alert("🎉 全班成绩已根据最新标准答案成功完成重新批阅！");
        });
    }

    // --- 颁奖仪式 ---
    function openCeremonyModal() {
        document.getElementById('podium-round-num').innerText = currentRoundId;
        db.ref(`rounds/${currentRoundId}/leaderboard`).once('value', snap => {
            var data = Object.values(snap.val() || {});
            data.sort((a, b) => (b.score !== a.score) ? (b.score - a.score) : (a.total_seconds - b.total_seconds));

            for (var i = 1; i <= 3; i++) {
                var item = data[i - 1];
                var nameEl = document.getElementById('name-rank-' + i);
                var groupEl = document.getElementById('group-rank-' + i);
                var scoreEl = document.getElementById('score-rank-' + i);

                if (item) {
                    nameEl.innerText = item.team;
                    groupEl.innerText = item.group;
                    var penExtra = item.hasPenalty ? ' <span style="color:#ff4a4a; font-size:10px;">(含30s罚时)</span>' : '';
                    scoreEl.innerHTML = item.score + " 分 (" + item.time_used + ")" + penExtra;
                } else {
                    nameEl.innerText = "虚位以待";
                    groupEl.innerText = "-";
                    scoreEl.innerText = "-";
                }
            }

            document.getElementById('ceremony-modal').style.display = 'flex';
            triggerCelebrationEffects();
        });
    }

    function closeCeremonyModal() {
        document.getElementById('ceremony-modal').style.display = 'none';
        stopConfetti();
    }

    function triggerCelebrationEffects() {
        startConfetti();
        playVictorySound();
    }

    function playVictorySound() {
        try {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            var ctx = new AudioContext();

            var notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
            notes.forEach((freq, index) => {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, ctx.currentTime + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.1 + 0.6);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + index * 0.1);
                osc.stop(ctx.currentTime + index * 0.1 + 0.6);
            });
        } catch(e) { console.log(e); }
    }

    var confettiAnimationId = null;
    var confettiParticles = [];

    function startConfetti() {
        var canvas = document.getElementById('confetti-canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        confettiParticles = [];
        var colors = ['#ffd700', '#00ffcc', '#ff4a4a', '#ff99cc', '#3399ff', '#ffffff'];

        for (var i = 0; i < 150; i++) {
            confettiParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                speedY: Math.random() * 3 + 2,
                speedX: Math.random() * 2 - 1,
                rotation: Math.random() * 360,
                rotSpeed: Math.random() * 10 - 5
            });
        }

        if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;

                if (p.y > canvas.height) p.y = -10;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            });
            confettiAnimationId = requestAnimationFrame(renderConfetti);
        }
        renderConfetti();
    }

    function stopConfetti() {
        if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
        var canvas = document.getElementById('confetti-canvas');
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function exportPDF() { window.print(); }

    function clearCurrentRoundData() {
        if (confirm(`⚠️ 确定要清空第 ${currentRoundId} 轮的所有成绩与登记数据吗？`)) {
            db.ref(`rounds/${currentRoundId}`).remove();
            alert("数据已清空！");
        }
    }

    initRounds();
</script>
