<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小六才艺营 - 科学站实操现场大榜</title>
    <style>
        body {
            background-color: #0a1118; color: #fff;
            font-family: 'Microsoft YaHei', sans-serif; padding: 30px; text-align: center;
        }
        h1 { color: #00ffcc; font-size: 36px; text-shadow: 0 0 15px rgba(0,255,204,0.4); margin-bottom: 20px; }
        .board-container {
            max-width: 900px; margin: 0 auto; background: #132230;
            border: 2px solid #00ffcc; border-radius: 12px; padding: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #ffd700; font-size: 18px; border-bottom: 2px solid #ffd700; }
        tr:nth-child(1) td { color: #ffd700; font-weight: bold; font-size: 22px; }
        tr:nth-child(2) td { color: #c0c0c0; font-weight: bold; font-size: 19px; }
        tr:nth-child(3) td { color: #cd7f32; font-weight: bold; font-size: 18px; }
        .badge {
            background: rgba(0,255,204,0.1); border: 1px solid #00ffcc;
            padding: 3px 8px; border-radius: 4px; font-size: 14px; color: #00ffcc;
        }
        
        /* 控制按钮区域 */
        .action-bar {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn-control {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-export {
            background: #00ffcc;
            color: #0a1118;
        }
        .btn-export:hover {
            background: #00cc99;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }
        .btn-clear {
            background: rgba(255, 74, 74, 0.2);
            color: #ff4a4a;
            border: 1px solid #ff4a4a;
        }
        .btn-clear:hover {
            background: #ff4a4a;
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 74, 74, 0.4);
        }

        /* PDF 导出打印样式优化 */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 10px;
            }
            h1 {
                color: #000000 !important;
                text-shadow: none !important;
                font-size: 24px;
            }
            .board-container {
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                background: #ffffff !important;
            }
            th {
                color: #000000 !important;
                border-bottom: 2px solid #000 !important;
            }
            td {
                color: #000000 !important;
                border-bottom: 1px solid #ddd !important;
            }
            tr:nth-child(1) td, tr:nth-child(2) td, tr:nth-child(3) td {
                color: #000000 !important;
            }
            .badge {
                border: 1px solid #666 !important;
                color: #000 !important;
                background: none !important;
            }
            .action-bar {
                display: none !important; /* 导出时隐藏按钮 */
            }
        }
    </style>
</head>
<body>

    <h1>🏆 小六才艺营 - 科学站实时风云榜</h1>
    <div class="board-container">
        <table>
            <thead>
                <tr>
                    <th>名次</th>
                    <th>组别</th>
                    <th>小队名称</th>
                    <th>得分 (满分10)</th>
                    <th>完成用时</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- 动态渲染 -->
            </tbody>
        </table>

        <!-- 控制按钮区域 -->
        <div class="action-bar">
            <button class="btn-control btn-export" onclick="exportToPDF()">📄 导出成绩单 (PDF)</button>
            <button class="btn-control btn-clear" onclick="clearLeaderboard()">🗑️ 清除所有成绩</button>
        </div>
    </div>

<script>
    function updateLeaderboard() {
        // 读取数据
        var data = JSON.parse(localStorage.getItem('camp_leaderboard') || '[]');

        // 排序规则：得分从高到低；若得分相同，用时（秒数）从小到大
        data.sort(function(a, b) {
            if (b.score !== a.score) {
                return b.score - a.score;
            } else {
                return a.total_seconds - b.total_seconds;
            }
        });

        var tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="color:#88a0b5;">等待特工小队完成任务提交数据...</td></tr>';
            return;
        }

        data.forEach(function(item, index) {
            var rankIcon = index === 0 ? '🥇 1' : index === 1 ? '🥈 2' : index === 2 ? '🥉 3' : (index + 1);
            tbody.innerHTML += `
                <tr>
                    <td>${rankIcon}</td>
                    <td><span class="badge">${item.group}</span></td>
                    <td>${item.team}</td>
                    <td style="color:#ffd700; font-weight:bold;">${item.score} 分</td>
                    <td style="font-family:monospace;">${item.time_used}</td>
                </tr>
            `;
        });
    }

    // 1. 导出 PDF 功能 (调用原生打印弹窗，另存为 PDF)
    function exportToPDF() {
        var data = JSON.parse(localStorage.getItem('camp_leaderboard') || '[]');
        if (data.length === 0) {
            alert("目前暂无比赛成绩，无需导出！");
            return;
        }
        window.print();
    }

    // 2. 清除成绩功能 (带安全询问弹窗)
    function clearLeaderboard() {
        var data = JSON.parse(localStorage.getItem('camp_leaderboard') || '[]');
        if (data.length === 0) {
            alert("榜单目前已经是空的！");
            return;
        }

        // 第一重确认
        var confirm1 = confirm("⚠️ 警告：您确定要清除所有小队的成绩记录吗？");
        if (confirm1) {
            // 第二重确认：确保已保存/导出
            var confirm2 = confirm("🚨 请再次确认：您是否已经【导出/保存】了当前的成绩单？\n\n点击【确定】将永久删除本次营会的所有成绩！");
            if (confirm2) {
                localStorage.removeItem('camp_leaderboard');
                updateLeaderboard();
                alert("成绩记录已成功清空，可以开始新一轮的营会挑战！");
            }
        }
    }

    // 初始更新并每 3 秒自动刷新现场排行榜
    updateLeaderboard();
    setInterval(updateLeaderboard, 3000);
</script>
</body>
</html>
